openapi: 3.1.0
info:
  title: PERKS solution 6a — Procedure API (ITS actions & MCP tools)
  version: 2.0.0
  description: |-
    Every action of the **PERKS Backend** ITS app (`3f519f2c-518e-44e7-bf94-c834660018be`). Supersedes the earlier two-endpoint Procedure API doc, which covered only the add/update + delete ingest calls; those two are unchanged here and keep their original request/response schemas.

    Two ways to call the same actions:

    1. **Executioner REST** — `POST /api/executioner/actions/{actionId}` with the input fields at the TOP LEVEL of the body (NOT wrapped in `{input:{...}}`). This is what the procedure UI uses. One path per action is documented below.
    2. **MCP** — `POST /mcp` (Streamable HTTP, protocol `2025-06-18`, server "Onlim MCP server" 1.0.0). Only actions with category `MCP` that are activated for the calling org appear in `tools/list`; for BEKO that is 8 of the 24 actions (flagged `x-mcp-tool: true` below).

    ITS is shared between the production and staging proxies, so **action ids are stable across both**; what differs per environment is which branch is activated for the calling organisation. The `x-branch` / `x-version-id` values recorded on each operation were read from the `new-ui-backend` branch, the one the BEKO org runs.

    Action definitions live in the dev org `2d2d0691-041c-4778-9b30-99aefed263aa`; they EXECUTE against the use-case org whose id and API key you send in the headers (e.g. BEKO or FAGOR — which share one triple store, namespaced `pko/beko#` vs `pko/fagor#`).
servers:
- url: https://proxy.onlim.com/api/its
  description: Production proxy (org API key auth) — the base for the published partner API
- url: https://proxy-staging.onlim.com/api/its
  description: Staging proxy (org API key auth)
tags:
- name: Discovery
  description: Read procedures and steps out of the knowledge graph.
- name: Execution
  description: 'Procedure-execution lifecycle: start, step, pause/finish, resume, trace, issue reporting.'
- name: Config
  description: Org-wide key/value configuration.
- name: Import
  description: Write procedures into the knowledge graph.
- name: Vector documents
  description: MUS upload + VCT vectorization for document/vector querying.
- name: Legacy chat
  description: Pre-new-UI chat-era actions, kept on the branch. Not used by the procedure UI.
- name: MCP
  description: The Model Context Protocol transport endpoint.
security:
- orgApiKey: []
  orgId: []
paths:
  /api/executioner/actions/a101a48a-c49d-4024-bbd7-b433a6f34e54:
    post:
      tags:
      - Discovery
      summary: Search procedures by keyword
      operationId: SearchProcedure
      x-action-id: a101a48a-c49d-4024-bbd7-b433a6f34e54
      x-category:
      - MCP
      x-mcp-tool: true
      x-branch: new-ui-backend
      x-version-id: 4200bf05-4a19-4868-8c03-8c6581aeaca0
      description: |-
        Search the knowledge graph for procedures by keyword. Returns matching procedures (id, title, description, status, version) and a flag for group-LOTO eligibility. Use this to find a procedure the user wants to start.

        **Action id** `a101a48a-c49d-4024-bbd7-b433a6f34e54` · **branch** `new-ui-backend` · **version** `4200bf05-4a19-4868-8c03-8c6581aeaca0` · **category** `MCP`

        Exposed as an **MCP tool** to the BEKO org (`tools/list`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword:
                  type: string
                  title: keyword
                  description: search keyword for the procedure
              additionalProperties: true
      responses:
        '200':
          description: Bare JSON-LD array of matching procedures (id, title, description, status, version,
            `pkobeko:hasGroupLotoStep` flag).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayResult'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/6bc5d6e9-63cc-4735-8a65-0618b62a7e70:
    post:
      tags:
      - Discovery
      summary: Full step tree of a procedure
      operationId: GetProcedureTree
      x-action-id: 6bc5d6e9-63cc-4735-8a65-0618b62a7e70
      x-category:
      - MCP
      x-mcp-tool: true
      x-branch: new-ui-backend
      x-version-id: 0480f9e6-de05-443f-b20f-7ad6626f62d0
      description: |-
        Return the complete step tree of a procedure (all nesting levels): each step's title, hierarchical identifier, ordering number, and child steps. Lightweight outline for navigation/rendering. Input: uri of the procedure.

        **Action id** `6bc5d6e9-63cc-4735-8a65-0618b62a7e70` · **branch** `new-ui-backend` · **version** `0480f9e6-de05-443f-b20f-7ad6626f62d0` · **category** `MCP`

        Exposed as an **MCP tool** to the BEKO org (`tools/list`).

        _Note:_ A procedure has NO outgoing `pko:hasStep`; steps attach to it via `onlim:isStepOf` (stored transitively). Roots = steps with no incoming `pko:hasStep`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uri:
                  type: string
                  title: uri
                  description: The URI of the procedure to fetch the full step tree for
              required:
              - uri
              additionalProperties: true
      responses:
        '200':
          description: FLAT array of every step at every depth; hierarchy is rebuilt from the direct `pko:hasStep`
            links. Ordering via `pko:stepNumber`, display number via `dcterms:identifier`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayResult'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/2fe4ee6d-b864-4a4f-b685-4515c260b9d9:
    post:
      tags:
      - Discovery
      summary: Full detail for one step and its substeps
      operationId: GetStepDetails
      x-action-id: 2fe4ee6d-b864-4a4f-b685-4515c260b9d9
      x-category:
      - INTENT
      x-mcp-tool: false
      x-branch: new-ui-backend
      x-version-id: 8984d912-217f-4f6e-a281-01e35a5a15e8
      description: |-
        Return full detail for one step and its substeps: references (docs/images), required PPE, verification, and required action. Input: uri of the step.

        **Action id** `2fe4ee6d-b864-4a4f-b685-4515c260b9d9` · **branch** `new-ui-backend` · **version** `8984d912-217f-4f6e-a281-01e35a5a15e8` · **category** `INTENT`

        NOT exposed over MCP — call the executioner endpoint directly (UI-direct action).

        _Note:_ BEKO PPE hangs off `pko-beko:MachineEnergyPoint` (via `appliesToMachineEnergyPoint`), not off the step; it is projected onto the step as `requiresPPE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uri:
                  type: string
                  title: uri
                  description: The URI of the step to fetch full detail for
              required:
              - uri
              additionalProperties: true
      responses:
        '200':
          description: 'FLAT array: the clicked step plus its `pko:hasStep*` descendants, each with references,
            required PPE, energy sources (title + hex colour), verification and required action. ~2–4
            KB vs 1.19 MB for the generic entity fetch.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayResult'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/112bc3cc-e5bd-42b9-aef2-7413da0ed17b:
    post:
      tags:
      - Discovery
      summary: Fetch any KG entity by URI with configurable expansion
      operationId: GetEntityDetails
      x-action-id: 112bc3cc-e5bd-42b9-aef2-7413da0ed17b
      x-category: []
      x-mcp-tool: false
      x-branch: new-ui-backend
      x-version-id: 78b05867-b74c-41ae-aa4e-99810625f8e3
      description: |-
        Fetch a knowledge-graph entity by URI with configurable expansion depth. Inputs: uri (required); levelOfDetail (optional number).

        **Action id** `112bc3cc-e5bd-42b9-aef2-7413da0ed17b` · **branch** `new-ui-backend` · **version** `78b05867-b74c-41ae-aa4e-99810625f8e3` · **category** `—`

        NOT exposed over MCP — call the executioner endpoint directly (UI-direct action).

        _Note:_ xHop is capped at 3, which drops deep step titles — retired from the prototype in favour of GetProcedureTree.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uri:
                  type: string
                  title: uri
                  description: URI of the object
                levelOfDetail:
                  type: number
                  title: levelOfDetail
                  description: how deep should the instance search go
                  default: 3
              required:
              - uri
              additionalProperties: true
      responses:
        '200':
          description: The entity expanded to the requested level of detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectResult'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/d2c474ac-77de-4511-94e9-b620d08b85aa:
    post:
      tags:
      - Execution
      summary: Start executing a procedure
      operationId: StartProcedureExecution
      x-action-id: d2c474ac-77de-4511-94e9-b620d08b85aa
      x-category:
      - MCP
      x-mcp-tool: true
      x-branch: new-ui-backend
      x-version-id: 76b1916d-1543-44b4-8cfb-4b9228a962c3
      description: |-
        Start executing a procedure. Creates the room-scoped procedure-execution state and emits a Kafka event. Inputs: procedureURI (required); isGroupLoto (optional boolean, only for LOTO procedures run as group lock-out).

        **Action id** `d2c474ac-77de-4511-94e9-b620d08b85aa` · **branch** `new-ui-backend` · **version** `76b1916d-1543-44b4-8cfb-4b9228a962c3` · **category** `MCP`

        Exposed as an **MCP tool** to the BEKO org (`tools/list`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                procedureURI:
                  type: string
                  title: procedure uri
                  description: The URI of the procedure to start executing
                isGroupLoto:
                  type: boolean
                  title: is group loto
                  description: Whether the procedure runs as group LOTO. Only relevant for LOTO procedures
                  default: false
                requestId:
                  type: string
                  title: request id
                  description: Client id to correlate the result in app-state.results
                roomUid:
                  type: string
                  description: Room identifier; scopes the execution state (`room:<roomUid>_<key>`). TOP-LEVEL
                    body field, read by the executioner itself — not part of the action input schema.
              additionalProperties: true
      responses:
        '200':
          description: The freshly created `executionState`. Also writes room-scoped state and emits a
            Kafka event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionState'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/081c7477-a722-4d49-9df9-5aa8b9c3d11b:
    post:
      tags:
      - Execution
      summary: Mark a step as executed
      operationId: ExecuteStep
      x-action-id: 081c7477-a722-4d49-9df9-5aa8b9c3d11b
      x-category:
      - MCP
      x-mcp-tool: true
      x-branch: new-ui-backend
      x-version-id: f81df004-c163-4700-8005-e795788e46cf
      description: |-
        Mark a procedure step as executed/completed. Appends a StepExecution (chained to the previous one) to the room execution state and emits a Kafka event. Input: stepURI of the completed step.

        **Action id** `081c7477-a722-4d49-9df9-5aa8b9c3d11b` · **branch** `new-ui-backend` · **version** `f81df004-c163-4700-8005-e795788e46cf` · **category** `MCP`

        Exposed as an **MCP tool** to the BEKO org (`tools/list`).

        _Note:_ BATCH: also accepts an ordered `stepURIs` array (not in the declared schema — allowed by `additionalProperties: true`), recording N chained StepExecutions in one call. The single-`stepURI` response is byte-identical to before.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stepURI:
                  type: string
                  title: step uri
                  description: The URI of the step that has been completed/executed (single-step path)
                requestId:
                  type: string
                  title: request id
                  description: Client-supplied id to correlate the structured result in app-state.results
                roomUid:
                  type: string
                  description: Room identifier; scopes the execution state (`room:<roomUid>_<key>`). TOP-LEVEL
                    body field, read by the executioner itself — not part of the action input schema.
                stepURIs:
                  type: array
                  items:
                    type: string
                  description: 'Undeclared batch input (accepted via additionalProperties): ordered step
                    URIs recorded as N chained StepExecutions in one call.'
              additionalProperties: true
      responses:
        '200':
          description: Updated `executionState` with the appended StepExecution(s); emits Kafka.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionState'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/2efa6907-51cc-4374-a63c-29762b7db11f:
    post:
      tags:
      - Execution
      summary: Finish / cancel / pause the current execution
      operationId: FinishProcedureExecution
      x-action-id: 2efa6907-51cc-4374-a63c-29762b7db11f
      x-category:
      - MCP
      x-mcp-tool: true
      x-branch: new-ui-backend
      x-version-id: d5069038-9a41-44be-bd85-019089ae9d17
      description: |-
        Finish the current procedure execution: set its final status (pko:Completed or pko:Cancelled), persist the whole execution to the knowledge graph, emit Kafka, and clear the room state. Inputs: status (required); userFeedback (optional).

        **Action id** `2efa6907-51cc-4374-a63c-29762b7db11f` · **branch** `new-ui-backend` · **version** `d5069038-9a41-44be-bd85-019089ae9d17` · **category** `MCP`

        Exposed as an **MCP tool** to the BEKO org (`tools/list`).

        _Note:_ Pausing is this action with `status: "pko:Paused"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userFeedback:
                  type: string
                  title: user feedback
                  description: The feedback given by the user to the execution
                status:
                  type: string
                  title: status
                  description: Procedure status
                  enum:
                  - pko:Completed
                  - pko:Cancelled
                  - pko:Paused
                requestId:
                  type: string
                  title: request id
                  description: Client id to correlate the result
                roomUid:
                  type: string
                  description: Room identifier; scopes the execution state (`room:<roomUid>_<key>`). TOP-LEVEL
                    body field, read by the executioner itself — not part of the action input schema.
              additionalProperties: true
      responses:
        '200':
          description: Confirmation object; the whole execution is persisted to the KG, Kafka is emitted
            and the room state is cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectResult'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/bfcc5ec7-fa1c-4c45-9d0f-0e07552bd518:
    post:
      tags:
      - Execution
      summary: Resume a paused execution
      operationId: ResumeProcedureExecution
      x-action-id: bfcc5ec7-fa1c-4c45-9d0f-0e07552bd518
      x-category:
      - MCP
      x-mcp-tool: true
      x-branch: new-ui-backend
      x-version-id: 062996ce-ed9c-4379-80de-ebb9aa627ddf
      description: |-
        Resume a previously paused procedure execution by its procedureExecutionURI. Reloads the execution and its already-completed steps from the knowledge graph into the current room and sets the status to in-progress so the user can continue. Use after the user chooses a paused execution to continue (e.g. 'resume/continue this procedure').

        **Action id** `bfcc5ec7-fa1c-4c45-9d0f-0e07552bd518` · **branch** `new-ui-backend` · **version** `062996ce-ed9c-4379-80de-ebb9aa627ddf` · **category** `MCP`

        Exposed as an **MCP tool** to the BEKO org (`tools/list`).

        _Note:_ Does NOT re-persist the KG status — it stays `pko:Paused` until the next Finish. Throws "The paused execution is not available yet. Please try again later." if the KG has not yet indexed the paused execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                procedureExecutionURI:
                  type: string
                  title: procedure execution uri
                  description: The @id of the paused ProcedureExecution to resume
                requestId:
                  type: string
                  title: request id
                  description: Client-supplied id to correlate the result in app-state.results
                roomUid:
                  type: string
                  description: Room identifier; scopes the execution state (`room:<roomUid>_<key>`). TOP-LEVEL
                    body field, read by the executioner itself — not part of the action input schema.
              additionalProperties: true
      responses:
        '200':
          description: Bare `executionState` rehydrated from the KG (status forced to `pko:InProgress`),
            re-seeded into the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionState'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/87628dba-2031-42b7-9b69-dcdc6fd8542f:
    post:
      tags:
      - Execution
      summary: List procedure executions by status
      operationId: SearchProcedureExecution
      x-action-id: 87628dba-2031-42b7-9b69-dcdc6fd8542f
      x-category:
      - MCP
      x-mcp-tool: true
      x-branch: new-ui-backend
      x-version-id: c7318e95-f299-4d76-9e7e-ee4ba1c54c4a
      description: |-
        List procedure executions filtered by status (default paused). Returns each execution with its procedure, status, start/end time, and completed step count. Use to find a paused or completed procedure execution the user wants to resume or review (e.g. 'which procedures did I pause?', 'show my paused procedures').

        **Action id** `87628dba-2031-42b7-9b69-dcdc6fd8542f` · **branch** `new-ui-backend` · **version** `c7318e95-f299-4d76-9e7e-ee4ba1c54c4a` · **category** `MCP`

        Exposed as an **MCP tool** to the BEKO org (`tools/list`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                procedureURI:
                  type: string
                  title: procedure uri
                  description: 'Optional filter: only return executions of this procedure URI'
                status:
                  type: string
                  title: status
                  description: Procedure execution status CURIE to filter by (default pko:Paused)
                  default: pko:Paused
                keyword:
                  type: string
                  title: keyword
                  description: Optional case-insensitive substring filter on the procedure title
              additionalProperties: true
      responses:
        '200':
          description: 'Bare array sorted by `startedAt` desc: `{procedureExecutionURI, procedureURI,
            procedureTitle?, status (full IRI), startedAt, endedAt, completedStepCount (string)}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayResult'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/fc54c7ae-8abf-45d3-89ef-6c5698ecde8d:
    post:
      tags:
      - Execution
      summary: Read the current room execution state
      operationId: GetExecutionState
      x-action-id: fc54c7ae-8abf-45d3-89ef-6c5698ecde8d
      x-category:
      - INTENT
      x-mcp-tool: false
      x-branch: new-ui-backend
      x-version-id: 1810bb1a-7975-40f0-82a7-e909a024ccb4
      description: |-
        Read the current room application state: the procedure execution (procedureExecution, stepExecutions, active/last step), plus issues, questions, and per-request results. No input; scoped to the room.

        **Action id** `fc54c7ae-8abf-45d3-89ef-6c5698ecde8d` · **branch** `new-ui-backend` · **version** `1810bb1a-7975-40f0-82a7-e909a024ccb4` · **category** `INTENT`

        NOT exposed over MCP — call the executioner endpoint directly (UI-direct action).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomUid:
                  type: string
                  description: Room identifier; scopes the execution state (`room:<roomUid>_<key>`). TOP-LEVEL
                    body field, read by the executioner itself — not part of the action input schema.
              additionalProperties: true
      responses:
        '200':
          description: The room-scoped app state (`procedureExecution`, `stepExecutions`, `activeStepExecution`,
            `lastStepExecution`, `results`) or null when no run is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionState'
        '400':
          description: Input validation failed (missing required field, or a `null` sent for a string-typed
            field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid `x-api-key` / `x-organization-id`.
  /api/executioner/actions/b1ab9eb6-8a35-4164-8b35-35cfc899bc07:
    post:
      tags:
      - Execution
      summary: Expand one ProcedureExecution into a full trace
      operationId: GetExecutionTrace
      x-action-id: b1ab9eb6-8a35-4164-8b35-35cfc899bc07
      x-category:
      - INTENT
      x-mcp-tool: false
      x-branch: main
      x-version-id: n/a
      description: |-
        Fetch one ProcedureExecution fully expanded from the KG: ordered StepExecution chain (executed step title, device, timings, prev/next links) + execution KPIs (co2Equivalent, fairnessFactor), target device, status, report, executedBy. Generic across use cases (siemens KPIs optional).

        **Action id** `b1ab9eb6-8a35-4164-8b35-35cfc899bc07` · **branch** `main` · **version** `n/a` · **category** `INTENT`

        NOT exposed over MCP — call the executioner endpoint directly (UI-direct action).

        _Note:_ ONLY present on the `siemens-new-ui-backend` branch — NOT available to the BEKO org.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                procedureExecutionURI:
                  type: string
                  title: procedure execution uri
                  description: URI of the ProcedureExecution to expand into a full step-by-step trace
